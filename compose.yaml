services:
  showcase:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: 3000
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:-}
      DATABASE_URL: ${DATABASE_URL:-}
      PGSSL: ${PGSSL:-false}
    volumes:
      - showcase-data:/app/.data

volumes:
  showcase-data:
